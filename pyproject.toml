[project]
name = "pipecat-demo"
version = "0.1.0"
description = "Pipecat STT -> LLM -> TTS cascade voice bot with per-block and end-to-end latency profiling (Gemini Live Transcribe + Gemini 3.5 Flash-Lite + Gemini 3.8 Flash-Lite TTS)"
readme = "README.md"
authors = [
    { name = "nits1987", email = "nitind0987@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.30.1",
    "num2words<=0.5.14",
    "pipecat-ai[google,runner,silero,webrtc]>=1.13.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
pipecat-demo = "pipecat_demo.server:run"
pipecat-benchmark = "pipecat_demo.benchmark:run"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
